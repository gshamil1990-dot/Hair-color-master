<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="35%" stop-color="#E5BE8D"/>
      <stop offset="70%" stop-color="#D9A773"/>
      <stop offset="100%" stop-color="#A27142"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A221D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#141211" stop-opacity="1"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="#141211"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#D9A773" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  
  <!-- Stylized M Monogram for Magdana Atelier -->
  <g transform="translate(256, 240)">
    <!-- Elegant serif strokes -->
    <path d="M -110 90 L -110 -60 Q -110 -85 -85 -85 L -75 -85 L -10 40 L 0 60 L 10 40 L 75 -85 L 85 -85 Q 110 -85 110 -60 L 110 90" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Fine inner lines -->
    <line x1="-110" y1="90" x2="-80" y2="90" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="90" x2="80" y2="90" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Top Atelier Sparkle Accent -->
    <path d="M 0 -115 Q 0 -95 18 -95 Q 0 -95 0 -75 Q 0 -95 -18 -95 Q 0 -95 0 -115 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-95" r="3" fill="#FFF"/>
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="390" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" letter-spacing="9" fill="#E5BE8D">ATELIER</text>
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" letter-spacing="4" fill="#A89F91">MAGDANA GADZHIEVA</text>
</svg>
